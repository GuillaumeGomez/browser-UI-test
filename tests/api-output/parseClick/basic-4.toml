instructions = [
  """const parseClickVar = await page.$(\"a\");
if (parseClickVar === null) { throw \"`a` not found\"; }
const optionValue = await parseClickVar.evaluate(elem => {
    if (elem.tagName.toLowerCase() === \"option\" &&
        elem.parentElement && elem.parentElement.tagName.toLowerCase() === \"select\")
    {
        return elem.value;
    }
    return null;
});
if (optionValue !== null) {
    const selectHandle = await parseClickVar.evaluateHandle(el => el.parentElement);
    const parentSelect = selectHandle.asElement();
    if (parentSelect) {
        await parentSelect.select(optionValue);
    } else {
        throw \"Couldn't convert parent select to a puppeteer handle\";
    }
} else {
    await parseClickVar.click();
}
""",
]
warnings = [
